<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5ส Warehouse Control — HTTP Sync Fix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #08090b;
    --panel: #111317;
    --panel-2: #171a1f;
    --line: #262a31;
    --line-soft: #1b1e24;
    --text: #f2f4f7;
    --text-dim: #99a1ac;
    --text-faint: #565d67;
    --accent: #22d3ee;
    --accent-dim: #123842;
    --blue: #3d7bf5;
    --ok: #2ecc71;
    --ok-dim: #123321;
    --warn: #f0a83a;
    --warn-dim: #4a3416;
    --bad: #ef4444;
    --bad-dim: #3d1e1e;
    --neutral: #5b6472;
    --neutral-dim: #1c1f25;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;}
  body{min-height:100vh;}
  #app{max-width:1180px;margin:0 auto;padding:20px 20px 60px;}

  /* ===== Header ===== */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 4px 20px;border-bottom:1px solid var(--line-soft);margin-bottom:20px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-mark{
    font-family:'Bebas Neue',sans-serif;
    font-size:30px;letter-spacing:1px;
    background:var(--accent);color:#052027;
    width:52px;height:52px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .brand-text h1{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1.5px;margin:0;color:var(--text);}
  .brand-text p{margin:2px 0 0;font-size:12.5px;color:var(--text-dim);}
  .admin-zone{display:flex;align-items:center;gap:10px;}
  .admin-status{font-size:12px;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;padding:4px 10px;border:1px solid var(--line);border-radius:20px;}
  .admin-status.on{color:var(--ok);border-color:var(--ok-dim);background:var(--ok-dim);}
  .btn{
    font-family:'Inter',sans-serif;font-weight:600;font-size:13px;
    padding:9px 16px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--text);cursor:pointer;
    transition:.15s ease;white-space:nowrap;
  }
  .btn:hover{border-color:var(--text-faint);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#052027;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent;}
  .btn-danger{background:transparent;border-color:var(--bad);color:var(--bad);}
  .btn-sm{padding:6px 11px;font-size:12px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  /* ===== KPI strip ===== */
  .kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
  .kpi-card{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);padding:14px 16px;}
  .kpi-card .label{font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.6px;}
  .kpi-card .value{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;margin-top:6px;color:var(--text);}
  .kpi-card .value.ok{color:var(--ok);}
  .kpi-card .value.warn{color:var(--warn);}
  .kpi-card .value.bad{color:var(--bad);}
  .kpi-card .sub{font-size:11.5px;color:var(--text-faint);margin-top:3px;}

  /* ===== Floor tabs ===== */
  .floor-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .floor-tab{
    font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;
    padding:9px 18px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel);color:var(--text-dim);cursor:pointer;position:relative;
  }
  .floor-tab.active{background:var(--accent);color:#052027;border-color:var(--accent);font-weight:600;}
  .floor-tab .dot{position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--bg);}

  /* ===== Main layout ===== */
  .floor-main{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start;}
  @media (max-width:860px){.floor-main{grid-template-columns:1fr;} .kpi-strip{grid-template-columns:repeat(2,1fr);}}

  .floor-map-wrap{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);padding:18px;}
  .map-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
  .map-header h2{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;margin:0;color:var(--text);}
  .legend{display:flex;gap:12px;font-size:11px;color:var(--text-faint);}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}

  .floor-map{
    position:relative;border:1px solid var(--line);border-radius:8px;
    overflow:hidden;background:#050607;
  }
  .floor-map-inner{position:relative;width:100%;}
  .floor-map-inner img{display:block;width:100%;height:auto;filter:saturate(.55) brightness(.85);}
  .zone-hotspot{
    position:absolute;border-radius:4px;cursor:pointer;
    border:1.5px solid rgba(255,255,255,.35);
    background:rgba(91,100,114,.35);
    transition:.15s ease;
    display:flex;align-items:flex-end;justify-content:flex-start;
    padding:4px;
  }
  .zone-hotspot:hover{background:rgba(255,255,255,.18);border-color:#fff;}
  .zone-hotspot.selected{border:2px solid var(--accent);box-shadow:0 0 0 2px rgba(34,211,238,.28) inset;}
  .zone-hotspot.status-ok{background:rgba(53,201,135,.38);border-color:rgba(53,201,135,.8);}
  .zone-hotspot.status-warn{background:rgba(240,168,58,.38);border-color:rgba(240,168,58,.8);}
  .zone-hotspot.status-bad{background:rgba(239,91,91,.4);border-color:rgba(239,91,91,.85);}
  .zone-hotspot .zlabel{
    font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);
    line-height:1.15;pointer-events:none;
  }
  .zone-hotspot .zbadge{
    position:absolute;top:-7px;right:-7px;background:var(--bad);color:#fff;
    font-size:10px;font-family:'IBM Plex Mono',monospace;font-weight:700;
    padding:1px 6px;border-radius:10px;border:2px solid var(--panel);
  }
  .map-caption{font-size:11px;color:var(--text-faint);margin-top:8px;text-align:right;}
  .zone-hotspot.status-stale{background:rgba(91,100,114,.4);border-color:rgba(154,164,182,.6);}
  .zone-hotspot .zstale-tag{
    position:absolute;bottom:-7px;left:6px;background:var(--panel-2);color:var(--text-faint);
    font-size:9px;font-family:'IBM Plex Mono',monospace;padding:1px 5px;border-radius:8px;
    border:1px solid var(--line);white-space:nowrap;
  }

  /* ===== Side panel ===== */
  .side-panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);padding:18px;min-height:200px;position:sticky;top:16px;}
  .empty-state{color:var(--text-faint);font-size:13px;text-align:center;padding:40px 10px;}
  .sp-title{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:.5px;margin:0 0 2px;}
  .sp-floor{font-size:11.5px;color:var(--text-faint);margin-bottom:14px;}
  .sp-kpi{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .sp-kpi-ring{
    width:56px;height:56px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;
    border:4px solid var(--neutral);flex-shrink:0;
  }
  .sp-kpi-ring.ok{border-color:var(--ok);color:var(--ok);}
  .sp-kpi-ring.warn{border-color:var(--warn);color:var(--warn);}
  .sp-kpi-ring.bad{border-color:var(--bad);color:var(--bad);}
  .sp-kpi-text{font-size:12px;color:var(--text-dim);}
  .sp-kpi-text b{color:var(--text);}
  .sp-section-label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-faint);margin:16px 0 8px;}
  .checklist-item{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line-soft);color:var(--text-dim);}
  .checklist-item:last-child{border-bottom:none;}
  .checklist-item .mark{flex-shrink:0;font-weight:700;}
  .checklist-item .mark.y{color:var(--ok);}
  .checklist-item .mark.n{color:var(--bad);}
  .req-mini{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:12px;}
  .req-mini .rtext{color:var(--text);margin-bottom:4px;}
  .req-mini .rmeta{color:var(--text-faint);font-size:10.5px;font-family:'IBM Plex Mono',monospace;}

  /* ===== Requests board ===== */
  .requests-board{margin-top:26px;}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:10px;}
  .section-head h2{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;margin:0;}
  .filter-pills{display:flex;gap:6px;}
  .pill{font-size:11.5px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--text-dim);cursor:pointer;font-family:'IBM Plex Mono',monospace;}
  .pill.active{background:var(--text);color:var(--bg);border-color:var(--text);}

  .requests-list{display:flex;flex-direction:column;gap:8px;}
  .req-card{background:var(--panel);border:1px solid var(--line-soft);border-radius:8px;padding:12px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .req-left{flex:1;min-width:220px;}
  .req-loc{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent);margin-bottom:4px;}
  .req-text{font-size:13.5px;color:var(--text);margin-bottom:4px;}
  .req-meta{font-size:11px;color:var(--text-faint);}
  .status-badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
  .status-badge.pending{background:var(--bad-dim);color:var(--bad);}
  .status-badge.inprogress{background:var(--warn-dim);color:var(--warn);}
  .status-badge.done{background:var(--ok-dim);color:var(--ok);}
  .req-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  select.status-select{
    background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:6px;
    padding:6px 8px;font-size:11.5px;font-family:'IBM Plex Mono',monospace;
  }
  .empty-list{color:var(--text-faint);font-size:13px;padding:24px;text-align:center;background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius);}

  /* ===== Modal ===== */
  .modal-backdrop{position:fixed;inset:0;background:rgba(8,10,14,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;padding:22px;}
  .modal h3{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.5px;margin:0 0 4px;}
  .modal .modal-sub{font-size:12px;color:var(--text-faint);margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
  .field input[type=text], .field input[type=password], .field textarea{
    width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;
    color:var(--text);padding:9px 11px;font-size:13.5px;font-family:'Inter',sans-serif;
  }
  .field textarea{min-height:64px;resize:vertical;}
  .check-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);}
  .check-row:last-of-type{border-bottom:none;}
  .check-row .qtext{font-size:12.5px;color:var(--text);flex:1;}
  .toggle-pair{display:flex;gap:4px;flex-shrink:0;}
  .toggle-btn{font-size:11px;padding:5px 10px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--text-faint);cursor:pointer;font-family:'IBM Plex Mono',monospace;}
  .toggle-btn.on-y.active{background:var(--ok-dim);color:var(--ok);border-color:var(--ok);}
  .toggle-btn.on-n.active{background:var(--bad-dim);color:var(--bad);border-color:var(--bad);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .modal-close{position:absolute;}
  .modal-error{color:var(--bad);font-size:12px;margin-top:6px;}

  /* ===== Kiosk view (สแกน QR แล้วเห็นแค่เช็คลิสต์โซนเดียว) ===== */
  .kiosk-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .kiosk-card{background:var(--panel);border:1px solid var(--line-soft);border-radius:16px;padding:26px 22px;max-width:480px;width:100%;box-shadow:0 4px 18px rgba(20,45,31,.06);}
  .kiosk-zone{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--accent);margin-bottom:4px;}

  /* ===== Gemba Walk ===== */
  .gemba-card{background:var(--panel);border:1px solid var(--line-soft);border-radius:8px;padding:12px 14px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;}
  .gemba-photo{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line-soft);flex-shrink:0;background:var(--panel-2);}
  .gemba-photos{display:flex;gap:8px;flex-shrink:0;}
  .gemba-photo-label{font-size:9px;color:var(--text-faint);text-align:center;margin-top:2px;}
  .gemba-body{flex:1;min-width:180px;}
  .gemba-loc{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent);margin-bottom:4px;}
  .gemba-note{font-size:13.5px;color:var(--text);margin-bottom:4px;}
  .gemba-meta{font-size:11px;color:var(--text-faint);}
  .gemba-score{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;}
  .file-input-wrap{border:1px dashed var(--line);border-radius:8px;padding:14px;text-align:center;background:var(--panel-2);}
  .file-input-wrap input[type=file]{width:100%;font-size:12.5px;}
  .file-preview{max-width:100%;max-height:160px;border-radius:8px;margin-top:10px;display:none;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

  /* ===== My requests / timeline ===== */
  .my-req-search{display:flex;gap:8px;margin-bottom:14px;}
  .my-req-search input{flex:1;}
  .my-req-card{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:8px;padding:12px 14px;margin-bottom:10px;}
  .my-req-card .req-loc{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent);margin-bottom:4px;}
  .my-req-card .req-text{font-size:13.5px;color:var(--text);margin-bottom:6px;}
  .my-req-eta{font-size:11.5px;color:var(--text-dim);margin-bottom:8px;}
  .my-req-eta b{color:var(--text);}
  .timeline{display:flex;flex-direction:column;gap:0;margin-top:6px;}
  .timeline-row{display:flex;gap:8px;padding:3px 0;font-size:11px;color:var(--text-faint);}
  .timeline-dot{width:7px;height:7px;border-radius:50%;background:var(--neutral);margin-top:4px;flex-shrink:0;}
  .timeline-row.done .timeline-dot{background:var(--ok);}
  .timeline-row.inprogress .timeline-dot{background:var(--warn);}
  .timeline-row.pending .timeline-dot{background:var(--bad);}

  /* ===== QR sheet ===== */
  .qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;}
  .qr-item{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:8px;padding:10px;text-align:center;}
  .qr-item img{width:100%;border-radius:4px;background:#fff;padding:4px;}
  .qr-item .qname{font-size:11.5px;font-weight:700;margin-top:6px;color:var(--text);}
  .qr-item .qfloor{font-size:10px;color:var(--text-faint);}
  .due-input{
    background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:6px;
    padding:6px 8px;font-size:11px;font-family:'IBM Plex Mono',monospace;
  }
  .qr-item-actions{margin-top:8px;}
  .qr-item .btn-sm{width:100%;}
  .qr-floor-section{margin-bottom:22px;}
  .qr-floor-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line-soft);}
  .qr-floor-head h4{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.5px;margin:0;color:var(--accent);}
  .qr-fallback{display:none;font-size:9px;color:var(--text-faint);word-break:break-all;padding:8px;border:1px dashed var(--line);border-radius:4px;}

  /* ===== Print ===== */
  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block !important;position:absolute;top:0;left:0;width:100%;background:#fff;}
    .print-page{page-break-after:always;padding:40px;text-align:center;font-family:'Inter',sans-serif;}
    .print-page:last-child{page-break-after:auto;}
    .print-page img{width:280px;height:280px;border:1px solid #ccc;padding:10px;}
    .print-page h2{font-size:22px;color:#111;margin:18px 0 4px;}
    .print-page p{font-size:14px;color:#555;margin:0;}
    .print-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:24px;}
    .print-grid .pg-item{text-align:center;font-family:'Inter',sans-serif;border:1px dashed #999;padding:12px;border-radius:6px;}
    .print-grid img{width:100%;max-width:170px;}
    .print-grid h3{font-size:13px;color:#111;margin:8px 0 2px;}
    .print-grid p{font-size:11px;color:#555;margin:0;}
  }


  /* =====================================================================
     THEME 04 — LIGHT GRAY + DARK GREEN
     Modern Industrial / Easy Read UI
     Visual-only override: application logic remains unchanged.
     ===================================================================== */
  :root{
    --bg:#f3f5f2;
    --panel:#ffffff;
    --panel-2:#f7f9f7;
    --line:#d9e1dc;
    --line-soft:#e8eeea;
    --text:#17231d;
    --text-dim:#53625a;
    --text-faint:#7b8981;
    --accent:#166534;
    --accent-dim:#e6f4eb;
    --blue:#2563eb;
    --ok:#178447;
    --ok-dim:#e6f5ec;
    --warn:#f28c18;
    --warn-dim:#fff2df;
    --bad:#dc2626;
    --bad-dim:#fdeaea;
    --neutral:#8a9590;
    --neutral-dim:#eef1ef;
    --radius:14px;
  }

  html,body{
    background:var(--bg);
    color:var(--text);
    font-size:16px;
  }
  body{
    background:
      linear-gradient(180deg,#f7f9f7 0,#f3f5f2 260px,#f3f5f2 100%);
  }
  #app{max-width:1280px;padding:22px 24px 72px;}

  /* Header */
  .topbar{
    background:#fff;
    border:1px solid var(--line-soft);
    border-radius:16px;
    padding:15px 18px;
    margin:0 0 20px;
    box-shadow:0 4px 18px rgba(20,45,31,.06);
  }
  .brand{gap:13px;}
  .brand-mark{
    width:56px;height:56px;
    background:linear-gradient(145deg,#166534,#0f5130);
    color:#fff;
    border-radius:14px;
    box-shadow:0 6px 14px rgba(22,101,52,.18);
  }
  .brand-text h1{
    font-family:'Inter',sans-serif;
    font-size:20px;
    font-weight:800;
    letter-spacing:.3px;
    color:#153122;
  }
  .brand-text p{font-size:13px;color:#65746c;margin-top:4px;}
  .admin-zone{gap:9px;}
  .admin-status{
    min-height:38px;
    display:inline-flex;align-items:center;
    border-color:#d9e1dc;
    background:#f8faf9;
    color:#65746c;
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:7px 12px;
  }
  .admin-status.on{color:#116334;border-color:#a8d3b8;background:#eaf6ee;}

  /* Buttons — larger targets for easier use */
  .btn{
    min-height:42px;
    padding:10px 16px;
    border-radius:10px;
    border-color:#cad6cf;
    background:#fff;
    color:#284238;
    font-size:14px;
    box-shadow:0 1px 2px rgba(18,50,32,.03);
  }
  .btn:hover{
    border-color:#7e9b8b;
    background:#f7faf8;
    transform:translateY(-1px);
  }
  .btn-primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;

<!-- ============ FIREBASE CONFIG — แก้ค่าด้านล่างนี้ก่อนใช้งานจริง ============ -->
<script type="module">
(async function(){
  try{
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    // ใช้ Firestore Lite: รับ-ส่งผ่าน HTTP/fetch โดยตรง
    // เหมาะกับ iPhone / 4G-5G / GitHub Pages มากกว่า WebChannel/Long Polling
    const { getFirestore, doc, setDoc, getDoc } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-lite.js");

    // TODO: แทนที่ค่าด้านล่างด้วยค่าจริงจาก Firebase Console
    // (Project settings > General > Your apps > SDK setup and configuration)
    const firebaseConfig = {
      apiKey: "AIzaSyC6q65QYj0LE5EoCgHLIiNfku3iuARYjCY",
      authDomain: "fir-warehouse.firebaseapp.com",
      projectId: "fir-warehouse",
      storageBucket: "fir-warehouse.firebasestorage.app",
      messagingSenderId: "342199775269",
      appId: "1:342199775269:web:89ae95e4785f10a7a28fcc"
    };

    const isConfigured = firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY";

    if(!isConfigured){
      window.__fbConfigMissing = true;
      window.dispatchEvent(new Event('fbconfigmissing'));
      return;
    }

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const docRef = doc(db, "fivese", "main");

    // Firestore Lite ไม่มี realtime listener จึงใช้ HTTP polling ทุก 8 วินาทีแทน
    // ข้อดี: ไม่ต้องพึ่ง WebSocket/WebChannel/Long Polling ซึ่งเป็นจุดที่ iPhone บางเครื่องค้าง
    window.__fb = {
      async saveData(data){
        try{
          await setDoc(docRef, data);
          window.__fbLastWriteOk = Date.now();
        }catch(err){
          window.__fbLastWriteError = err;
          throw err;
        }
      },
      onSnapshot(onData, onError){
        let active = true;
        let busy = false;

        const readOnce = async ()=>{
          if(!active || busy) return;
          busy = true;
          try{
            const snap = await getDoc(docRef);
            if(!active) return;
            onData(snap.exists() ? snap.data() : { submissions: [], requests: [], gembaFindings: [] });
          }catch(err){
            window.__fbSnapshotError = err;
            if(onError) onError(err);
          }finally{
            busy = false;
          }
        };

        readOnce();
        const timer = setInterval(readOnce, 8000);
        return ()=>{
          active = false;
          clearInterval(timer);
        };
      },
      // อัปโหลดรูปไปยัง Google Drive ผ่าน Apps Script (แทน Firebase Storage ที่ต้องใช้แผน Blaze)
      async uploadPhoto(blob, path, timeoutMs){
        timeoutMs = timeoutMs || 30000;
        const base64 = await new Promise((resolve, reject)=>{
          const reader = new FileReader();
          reader.onloadend = ()=> resolve(reader.result.split(',')[1]);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
        const filename = path.split('/').pop();
        const controller = new AbortController();
        const timer = setTimeout(()=>controller.abort(), timeoutMs);
        let res;
        try{
          res = await fetch(DRIVE_UPLOAD_URL, {
            method: 'POST',
            // ใช้ text/plain เพื่อเลี่ยง CORS preflight ที่ Apps Script ไม่รองรับ
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ base64, mimeType: blob.type || 'image/jpeg', filename }),
            signal: controller.signal,
            cache: 'no-store'
          });
        }catch(err){
          if(err && err.name === 'AbortError'){
            throw new Error(`อัปโหลดรูปใช้เวลานานเกิน ${Math.round(timeoutMs/1000)} วินาที`);
          }
          throw new Error('เชื่อมต่อ Google Drive ไม่สำเร็จ: ' + (err.message || String(err)));
        }finally{
          clearTimeout(timer);
        }
        if(!res.ok) throw new Error('อัปโหลดรูปไม่สำเร็จ (HTTP ' + res.status + ')');
        const text = await res.text();
        let data;
        try{ data = JSON.parse(text); }
        catch(e){
          throw new Error('Apps Script ตอบกลับไม่ถูกต้อง กรุณาตรวจสอบว่า Deploy เป็น Web app และ Access = Anyone');
        }
        if(!data.success) throw new Error(data.error || 'อัปโหลดรูปไม่สำเร็จ');
        if(!data.url) throw new Error('อัปโหลดรูปสำเร็จแต่ไม่ได้รับ URL รูปกลับมา');
        return data.url;
      }
    };
    window.__fbReady = true;
    window.dispatchEvent(new Event('fbready'));
  }catch(err){
    window.__fbInitError = err;
    window.dispatchEvent(new Event('fbiniterror'));
  }
})();
</script>

/* ============ STORAGE (Firebase Firestore) ============ */
function friendlyFirestoreError(e){
  const code = (e && e.code) ? String(e.code) : "";
  const msg = (e && e.message) ? String(e.message) : String(e || "");

  if(code.includes("permission-denied") || /permission-denied|insufficient permissions/i.test(msg)){
    return "Firestore ไม่อนุญาตให้เขียนข้อมูล (permission-denied) — ต้องแก้ Firestore Rules ให้หน้าเว็บนี้สามารถบันทึกได้";
  }
  if(code.includes("not-found") || /database.*not found|not-found/i.test(msg)){
    return "ไม่พบฐานข้อมูล Firestore ของโปรเจกต์ fir-warehouse — ตรวจสอบว่าได้สร้าง Firestore Database แล้ว";
  }
  if(code.includes("unavailable") || /failed to fetch|network|offline|unavailable/i.test(msg)){
    return "เชื่อมต่อ Firestore ไม่ได้ — ลองสลับ Wi‑Fi/4G‑5G แล้วเปิดหน้าใหม่";
  }
  return msg || "ไม่ทราบสาเหตุ";
}

async function saveData(options){
  options = options || {};
  // Firestore Lite เป็น HTTP request ปกติ ถ้าเกิน 20 วินาทีถือว่าการเชื่อมต่อมีปัญหาจริง
  const timeoutMs = options.timeoutMs || 20000;
  try{
    if(!window.__fb || !window.__fb.saveData){
      throw new Error("Firebase ยังไม่พร้อมใช้งาน");
    }
    await withTimeout(
      window.__fb.saveData(state.data),
      timeoutMs,
      `เชื่อมต่อ Firestore นานเกินไป (เกิน ${Math.round(timeoutMs/1000)} วินาที)`
    );
    cacheData(state.data);
    return true;
  }catch(e){
    console.error("บันทึกข้อมูลไม่สำเร็จ", e);
    if(!options.silent){
      alert("บันทึกข้อมูลไม่สำเร็จ: " + friendlyFirestoreError(e));
    }
    return false;
  }
}

function removeSubmissionAndRequest(subId, requestId){
  state.data.submissions = (state.data.submissions || []).filter(s=>s.id !== subId);
  if(requestId) state.data.requests = (state.data.requests || []).filter(r=>r.id !== requestId);
  cacheData(state.data);
}

function updateSubmissionPhoto(subId, patch){
  const sub = (state.data.submissions || []).find(s=>s.id === subId);

}

/* ============ HELPERS ============ */
function findFloor(fid){ return FLOORS.find(f=>f.id===fid); }
function findZone(fid, zid){ const f=findFloor(fid); return f ? f.zones.find(z=>z.id===zid) : null; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function compressImage(file, maxWidth, quality){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e)=>{ img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = ()=>{
      const scale = Math.min(1, maxWidth / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob((blob)=>{
        if(blob) resolve(blob); else reject(new Error('บีบอัดรูปไม่สำเร็จ'));
      }, 'image/jpeg', quality);
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleString('th-TH',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function fmtDueDate(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'2-digit'});
}
function fmtTime(ts){
  return new Date(ts).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
}
function latestSubmission(fid, zid){
  const subs = state.data.submissions.filter(s=>s.floorId===fid && s.zoneId===zid);
  if(subs.length===0) return null;
  return subs.reduce((a,b)=> a.ts > b.ts ? a : b);
}
function isSameLocalDay(ts1, ts2){
  const d1 = new Date(ts1), d2 = new Date(ts2);
  return d1.getFullYear()===d2.getFullYear() && d1.getMonth()===d2.getMonth() && d1.getDate()===d2.getDate();
}
function zoneStatus(fid, zid){
  const sub = latestSubmission(fid, zid);
  if(!sub) return { state:"none", pct:null, stale:true, checkedToday:false };
  const total = sub.items.length;
  const ok = sub.items.filter(i=>i.ok).length;
  const pct = total ? Math.round((ok/total)*100) : 100;
  let st = "bad";
  if(pct>=90) st="ok"; else if(pct>=70) st="warn";
  const checkedToday = isSameLocalDay(sub.ts, Date.now());
  const stale = !checkedToday;
  return { state: stale ? "stale" : st, pct, ok, total, stale, checkedToday, checkedAt: sub.ts };
}
function zonePendingCount(fid, zid){
  return state.data.requests.filter(r=>r.floorId===fid && r.zoneId===zid && r.status!=="done").length;
}
function floorAvgPct(fid){
  const f = findFloor(fid);
  const vals = f.zones.map(z=>zoneStatus(fid,z.id)).filter(s=>s.pct!==null).map(s=>s.pct);
  if(vals.length===0) return null;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}
function overallStats(){
  const allZonesCount = FLOORS.reduce((n,f)=>n+f.zones.length,0);
  let checkedZones = 0, pctSum = 0, uncheckedToday = 0;
  FLOORS.forEach(f=>f.zones.forEach(z=>{
    const s = zoneStatus(f.id,z.id);
    if(s.pct!==null){ checkedZones++; pctSum += s.pct; }
    if(s.stale) uncheckedToday++;
  }));
  const avgPct = checkedZones ? Math.round(pctSum/checkedZones) : null;
  const pending = state.data.requests.filter(r=>r.status==="pending").length;
  const inprogress = state.data.requests.filter(r=>r.status==="inprogress").length;
  const totalReq = state.data.requests.length;
  return { allZonesCount, checkedZones, avgPct, pending, inprogress, totalReq, uncheckedToday };
}

        const r = state.data.requests.find(x=>x.id===btn.dataset.delId);
        if(!r) return;
        if(!confirm(`ลบคำร้องขอ "${r.text}" ใช่หรือไม่? ลบแล้วกู้คืนไม่ได้`)) return;
        state.data.requests = state.data.requests.filter(x=>x.id!==r.id);
        await saveData(); renderAll();
      };
    });
  }
}

/* ============ MODAL: SUBMIT CHECKLIST ============ */
function openSubmitModal(fid, zid, isRecheck){
  const f = findFloor(fid), z = findZone(fid, zid);
  const root = document.getElementById('modalRoot');
  const answers = {};
  const recheckNote = isRecheck ? `<div style="font-size:11.5px;color:var(--warn);margin-bottom:12px">⚠ วันนี้เช็คโซนนี้ไปแล้ว การบันทึกนี้จะเพิ่มผลตรวจครั้งใหม่ทับของเดิม</div>` : '';
  root.innerHTML = `
    <div class="modal-backdrop" id="backdrop">
      <div class="modal">
        <h3>ตรวจเช็ค 5ส</h3>
        <div class="modal-sub">${f.label} · ${z.name}</div>
        ${recheckNote}
        <div id="checklistFields">
          ${z.items.map((label,idx)=>`
            <div class="check-row">
              <div class="qtext">${label}</div>
              <div class="toggle-pair">
                <button type="button" class="toggle-btn on-y" data-idx="${idx}" data-val="1">เรียบร้อย</button>
                <button type="button" class="toggle-btn on-n" data-idx="${idx}" data-val="0">ไม่เรียบร้อย</button>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="field" style="margin-top:14px">
          <label>สิ่งที่ต้องการ / ร้องขอเพิ่มเติม (ถ้ามี)</label>
          <textarea id="reqText" placeholder="เช่น ขอเปลี่ยนหลอดไฟ, ขอปลั๊กไฟเพิ่ม..."></textarea>
        </div>
        <div class="field">
          <label>ชื่อผู้ตรวจเช็ค (ไม่บังคับ)</label>
          <input type="text" id="reporterName" placeholder="ชื่อ-นามสกุล หรือรหัสพนักงาน">
        </div>
        <div class="field">
          <label>ถ่ายรูปยืนยันหลังเช็คเสร็จ</label>
          <div class="file-input-wrap">
            <input type="file" id="submitPhoto" accept="image/*" capture="environment">
            <img id="submitPhotoPreview" class="file-preview">
          </div>
        </div>
        <div class="modal-error" id="submitError" style="display:none">กรุณาตอบให้ครบทุกข้อและถ่ายรูปยืนยันก่อนบันทึก</div>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="cancelSubmit">ยกเลิก</button>
          <button class="btn btn-primary" id="saveSubmit">บันทึกผลตรวจ</button>
        </div>
      </div>
    </div>
  `;
  root.querySelectorAll('.toggle-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = btn.dataset.idx;
      answers[idx] = btn.dataset.val === "1";
      root.querySelectorAll(`.toggle-btn[data-idx="${idx}"]`).forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    };
  });
  document.getElementById('submitPhoto').onchange = (e)=>{
    const file = e.target.files[0];
    const preview = document.getElementById('submitPhotoPreview');
    if(file){
      const reader = new FileReader();
      reader.onload = (ev)=>{ preview.src = ev.target.result; preview.style.display='block'; };
      reader.readAsDataURL(file);
    }
  };
  document.getElementById('backdrop').onclick = (e)=>{ if(e.target.id==='backdrop') closeModal(); };
  document.getElementById('cancelSubmit').onclick = closeModal;
  const saveBtn = document.getElementById('saveSubmit');
  saveBtn.onclick = async ()=>{
    if(saveBtn.disabled) return;
    const photoFile = document.getElementById('submitPhoto').files[0];
    if(Object.keys(answers).length < z.items.length || !photoFile){
      document.getElementById('submitError').style.display = 'block';
      return;
    }
    saveBtn.disabled = true;
    saveBtn.textContent = "กำลังเชื่อมต่อ...";
    let subId = null;
    let requestId = null;
    try{
      await waitForFirebaseReady(30000);
      const items = z.items.map((label,idx)=>({label, ok: answers[idx]}));
      const requestText = document.getElementById('reqText').value.trim();
      const reporter = document.getElementById('reporterName').value.trim();
      const ts = Date.now();
      subId = uid();
      const submission = {
        id: subId, floorId: fid, zoneId: zid, ts, items, reporter,
        photoUrl: "", photoUploadStatus: "pending"
      };
      state.data.submissions.push(submission);
      if(requestText){
        requestId = uid();
        state.data.requests.push({
          id: requestId, floorId: fid, zoneId: zid, ts, text: requestText, status: "pending", reporter,
          dueDate: null, statusHistory: [{ status:"pending", ts }], editLog: []
        });
      }

      // จุดสำคัญ: บันทึกรายการตรวจเข้าฐานข้อมูลก่อน ไม่รอ Google Drive
      saveBtn.textContent = "กำลังบันทึกรายการ...";
      const firstSaveOk = await saveData();
      if(!firstSaveOk){
        removeSubmissionAndRequest(subId, requestId);
        saveBtn.disabled = false;
        saveBtn.textContent = "บันทึกผลตรวจ";
        return;
      }

      let photoWarning = "";
      try{
        saveBtn.textContent = "บันทึกรายการแล้ว • กำลังบีบอัดรูป...";
        const blob = await compressImage(photoFile, 900, 0.7);
        saveBtn.textContent = "บันทึกรายการแล้ว • กำลังส่งรูป...";
        const photoUrl = await window.__fb.uploadPhoto(blob, `checkin/${subId}.jpg`, PHOTO_UPLOAD_TIMEOUT_MS);
        updateSubmissionPhoto(subId, { photoUrl, photoUploadStatus: "done", photoUploadError: "" });
        const linked = await saveData({ silent:true, timeoutMs:20000 });
        if(!linked) photoWarning = "รูปอัปโหลดขึ้น Drive แล้ว แต่ยังผูก URL รูปกับรายการในฐานข้อมูลไม่สำเร็จ";
      }catch(photoErr){
        console.error("อัปโหลดรูปยืนยันไม่สำเร็จ แต่บันทึกรายการตรวจแล้ว", photoErr);
        photoWarning = photoErr.message || String(photoErr);
        updateSubmissionPhoto(subId, { photoUploadStatus: "failed", photoUploadError: photoWarning });
        // best effort: อัปเดตสถานะรูปแบบเงียบ ๆ โดยไม่ทำให้รายการตรวจที่บันทึกแล้วล้มเหลว
        await saveData({ silent:true, timeoutMs:10000 });
      }

      closeModal();
      renderAll();
      if(photoWarning){
        alert("บันทึกรายการตรวจสำเร็จแล้ว ✅\n\nแต่รูปยืนยันยังส่งไม่สำเร็จ: " + photoWarning + "\n\nรายการเช็คลิสต์และคำร้องขอถูกบันทึกไว้แล้ว");
      }
    }catch(e){
      console.error(e);
      if(subId) removeSubmissionAndRequest(subId, requestId);
      saveBtn.disabled = false;
      saveBtn.textContent = "บันทึกผลตรวจ";
      alert("บันทึกรายการไม่สำเร็จ: " + (e.message || String(e)));
    }
  };
}

/* ============ MODAL: QR SHEET (แอดมิน) ============ */
function zoneQrUrl(fid, zid){
  const baseUrl = location.origin + location.pathname;
  return `${baseUrl}?floor=${fid}&zone=${zid}`;
}
function qrImgTag(url, size, alt){
  const src = `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(url)}`;
  return `<img src="${src}" alt="${alt}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
          <div class="qr-fallback">QR โหลดไม่ได้ (ต้องเชื่อมต่ออินเทอร์เน็ต)<br>${escapeHtml(url)}</div>`;
}
function openQrModal(){
  const root = document.getElementById('modalRoot');
  const floorSections = FLOORS.map(f=>{
    const items = f.zones.map(z=>{
      const url = zoneQrUrl(f.id, z.id);
      return `<div class="qr-item">
          ${qrImgTag(url, 180, 'QR '+z.name)}
          <div class="qname">${z.name}</div>
          <div class="qfloor">${f.label}</div>
          <div class="qr-item-actions"><button class="btn btn-ghost btn-sm" data-print-single="${f.id}:${z.id}">พิมพ์ QR นี้</button></div>
        </div>`;
    }).join('');
    return `<div class="qr-floor-section">
        <div class="qr-floor-head">
          <h4>${f.label}</h4>
          <button class="btn btn-ghost btn-sm" data-print-floor="${f.id}">🖨 พิมพ์เฉพาะ${f.label}</button>
        </div>
        <div class="qr-grid">${items}</div>
      </div>`;
  }).join('');
  root.innerHTML = `
    <div class="modal-backdrop" id="backdrop">
      <div class="modal" style="max-width:680px">
        <h3>QR โค้ดประจำโซน</h3>
        <div class="modal-sub">พิมพ์แล้วนำไปติดหน้างานแต่ละโซน สแกนแล้วเปิดฟอร์มเช็คของโซนนั้นทันที · จัดกลุ่มตามชั้น<br>
        <span style="color:var(--warn)">หมายเหตุ: ลิงก์จะใช้งานได้จริงเมื่อไฟล์นี้ถูกอัปโหลดขึ้นเว็บที่มี URL ถาวรแล้วเท่านั้น</span></div>
        ${floorSections}
        <div class="modal-actions">
          <button class="btn btn-ghost" id="closeQr">ปิด</button>
          <button class="btn btn-primary" id="printAllQr">🖨 พิมพ์ QR ทุกชั้น</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('backdrop').onclick = (e)=>{ if(e.target.id==='backdrop') closeModal(); };
  document.getElementById('closeQr').onclick = closeModal;
  document.getElementById('printAllQr').onclick = ()=>printAllQr();
  root.querySelectorAll('[data-print-single]').forEach(btn=>{
    btn.onclick = ()=>{
      const [fid, zid] = btn.dataset.printSingle.split(':');
      printSingleQr(fid, zid);
    };
  });
  root.querySelectorAll('[data-print-floor]').forEach(btn=>{
    btn.onclick = ()=>printAllQr(btn.dataset.printFloor);
  });
}
function printSingleQr(fid, zid){
  const f = findFloor(fid), z = findZone(fid, zid);
  const url = zoneQrUrl(fid, zid);
  const printArea = document.getElementById('printArea');
  printArea.innerHTML = `
    <div class="print-page">
      ${qrImgTag(url, 280, 'QR '+z.name)}
      <h2>${f.label} · ${z.name}</h2>
      <p>สแกนก่อนกลับบ้าน เพื่อเช็ค 5ส ประจำโซนนี้</p>
    </div>`;
  triggerPrint();
}
function printAllQr(onlyFloorId){
  const printArea = document.getElementById('printArea');
  const floors = onlyFloorId ? FLOORS.filter(f=>f.id===onlyFloorId) : FLOORS;
  const pages = floors.map(f=>{
    const cards = f.zones.map(z=>{
      const url = zoneQrUrl(f.id, z.id);
      return `<div class="pg-item">
          ${qrImgTag(url, 200, 'QR '+z.name)}
          <h3>${z.name}</h3>
          <p>${f.label}</p>
        </div>`;
    }).join('');
    return `<div class="print-page" style="padding:0">
        <h2 style="margin:20px 0 10px">${f.label}</h2>
        <div class="print-grid">${cards}</div>
      </div>`;
  }).join('');
  printArea.innerHTML = pages;
  triggerPrint();
}
function triggerPrint(){
  setTimeout(()=>{
    window.print();
    setTimeout(()=>{ document.getElementById('printArea').innerHTML = ''; }, 500);
  }, 300);
}

  if(state.gembaFilter!=='all') items = items.filter(g=>g.status===state.gembaFilter);

    el.innerHTML = `<div class="empty-list">ยังไม่มีรายการที่พบจากการเดินตรวจ</div>`;

  }
  el.innerHTML = items.map(g=>{
    const f = findFloor(g.floorId); const z = findZone(g.floorId, g.zoneId);
    const statusBadge = g.status==='fixed'
      ? `<span class="status-badge done">แก้ไขแล้ว</span>`
      : `<span class="status-badge pending">พบปัญหา</span>`;
    const scoreHtml = (g.status==='fixed' && g.score!=null)
      ? `<span class="gemba-score" style="color:${g.score>=90?'var(--ok)':g.score>=70?'var(--warn)':'var(--bad)'}">${g.score}%</span>` : '';
    const photos = `<div class="gemba-photos">
        <div><img class="gemba-photo" src="${g.photoUrl}" alt="รูปที่พบ"><div class="gemba-photo-label">ก่อนแก้</div></div>
        ${g.fixedPhotoUrl ? `<div><img class="gemba-photo" src="${g.fixedPhotoUrl}" alt="รูปหลังแก้"><div class="gemba-photo-label">หลังแก้</div></div>` : ''}
      </div>`;
    const adminBtn = (state.isAdmin && g.status!=='fixed')
      ? `<button class="btn btn-primary btn-sm" data-fix-id="${g.id}" style="margin-top:8px">ทำเครื่องหมายว่าแก้ไขแล้ว</button>` : '';
    return `<div class="gemba-card">
        ${photos}
        <div class="gemba-body">
          <div class="gemba-loc">${f.label} · ${z ? z.name : ''}</div>
          <div class="gemba-note">${escapeHtml(g.note)}</div>
          <div class="gemba-meta">${fmtDate(g.ts)}${g.reporter?' · พบโดย '+escapeHtml(g.reporter):''} · ${statusBadge} ${scoreHtml}</div>
          ${g.fixedNote ? `<div class="gemba-meta" style="margin-top:4px">หมายเหตุการแก้ไข: ${escapeHtml(g.fixedNote)}</div>` : ''}
          ${adminBtn}
        </div>
      </div>`;
  }).join('');
  el.querySelectorAll('[data-fix-id]').forEach(btn=>{
    btn.onclick = ()=>openGembaFixModal(btn.dataset.fixId);
  });
}
function gembaZoneOptions(fid){
  const f = findFloor(fid);
  if(!f) return '';
  return f.zones.map(z=>`<option value="${z.id}">${z.name}</option>`).join('');
}

/* ============ KIOSK VIEW (สแกน QR แล้วเห็นแค่เช็คลิสต์โซนเดียว ไม่มีแดชบอร์ด) ============ */
function renderKioskView(fid, zid, isRecheck){
  const f = findFloor(fid), z = findZone(fid, zid);
  const st = zoneStatus(fid, zid);
  const appEl = document.getElementById('app');

  if(st.checkedToday && !isRecheck){
    appEl.innerHTML = `
      <div class="kiosk-wrap">
        <div class="kiosk-card" style="text-align:center">
          <div class="kiosk-zone">${f.label} · ${z.name}</div>
          <div style="font-size:40px;margin:10px 0">✓</div>
          <h2 style="margin:0 0 6px">เช็ควันนี้แล้ว</h2>
          <div style="color:var(--text-dim);font-size:13px;margin-bottom:18px">เวลา ${fmtTime(st.checkedAt)} · ${st.pct}% เรียบร้อย</div>
          <button class="btn btn-ghost btn-sm" id="kioskRecheckBtn">เช็คซ้ำ / แก้ไขของวันนี้</button>
        </div>
      </div>`;
    document.getElementById('kioskRecheckBtn').onclick = ()=>renderKioskView(fid, zid, true);
    return;
  }

  // เก็บค่าระหว่าง 2 ขั้นตอน (เช็คลิสต์ -> ถ่ายรูป) ไว้ในตัวแปรนี้
  const kioskState = { answers: {}, requestText: '', reporter: '' };

  function renderStep1(){
    appEl.innerHTML = `
      <div class="kiosk-wrap">
        <div class="kiosk-card">
          <div class="kiosk-zone">${f.label} · ${z.name}</div>
          <h2 style="margin:4px 0 4px">ตรวจเช็ค 5ส ก่อนกลับบ้าน</h2>
          <div style="font-size:11.5px;color:var(--text-faint);margin-bottom:14px">ขั้นตอนที่ 1/2 · ติ๊กเช็คให้ครบทุกข้อ</div>
          ${isRecheck ? `<div style="font-size:11.5px;color:var(--warn);margin-bottom:12px">⚠ วันนี้เช็คโซนนี้ไปแล้ว การบันทึกนี้จะเพิ่มผลตรวจครั้งใหม่ทับของเดิม</div>` : ''}
          <div>
            ${z.items.map((label,idx)=>`
              <div class="check-row">
                <div class="qtext">${label}</div>
                <div class="toggle-pair">
                  <button type="button" class="toggle-btn on-y" data-idx="${idx}" data-val="1">เรียบร้อย</button>
                  <button type="button" class="toggle-btn on-n" data-idx="${idx}" data-val="0">ไม่เรียบร้อย</button>
                </div>
              </div>`).join('')}
          </div>
          <div class="modal-error" id="kioskStep1Error" style="display:none">กรุณาตอบให้ครบทุกข้อก่อนไปต่อ</div>
          <button class="btn btn-primary" style="width:100%;margin-top:14px" id="kioskNextBtn">เช็คครบแล้ว ถัดไป: ถ่ายรูป →</button>
        </div>
      </div>`;
    appEl.querySelectorAll('.toggle-btn').forEach(btn=>{
      const idx = btn.dataset.idx;
      if(kioskState.answers[idx] === (btn.dataset.val==="1")) btn.classList.add('active');
      btn.onclick = ()=>{
        __kioskInteracted = true;
        kioskState.answers[idx] = btn.dataset.val === "1";
        appEl.querySelectorAll(`.toggle-btn[data-idx="${idx}"]`).forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
      };
    });
    document.getElementById('kioskNextBtn').onclick = ()=>{
      if(Object.keys(kioskState.answers).length < z.items.length){
        document.getElementById('kioskStep1Error').style.display = 'block';
        return;
      }
      renderStep2();
    };
  }

  function renderStep2(){
    appEl.innerHTML = `
      <div class="kiosk-wrap">
        <div class="kiosk-card">
          <div class="kiosk-zone">${f.label} · ${z.name}</div>
          <h2 style="margin:4px 0 4px">ถ่ายรูปยืนยันก่อนกลับบ้าน</h2>
          <div style="font-size:11.5px;color:var(--text-faint);margin-bottom:14px">ขั้นตอนที่ 2/2 · เช็คลิสต์ครบแล้ว เหลือแค่ถ่ายรูป</div>
          <div class="field">
            <label>ถ่ายรูปยืนยันว่าตรวจเช็คตามรายการเสร็จแล้ว</label>
            <div class="file-input-wrap">
              <input type="file" id="kioskPhoto" accept="image/*" capture="environment">
              <img id="kioskPhotoPreview" class="file-preview">
            </div>
          </div>
          <div class="field">
            <label>สิ่งที่ต้องการ / ร้องขอเพิ่มเติม (ถ้ามี)</label>
            <textarea id="kioskReqText" placeholder="เช่น ขอไม้กวาดเพิ่ม, ขอเปลี่ยนหลอดไฟ...">${kioskState.requestText}</textarea>
          </div>
          <div class="field">
            <label>ชื่อผู้ตรวจเช็ค (ไม่บังคับ)</label>
            <input type="text" id="kioskReporterName" placeholder="ชื่อ-นามสกุล หรือรหัสพนักงาน" value="${escapeHtml(kioskState.reporter)}">
          </div>
          <div class="modal-error" id="kioskStep2Error" style="display:none">กรุณาถ่ายรูปยืนยันก่อนบันทึก</div>
          <button class="btn btn-primary" style="width:100%;margin-top:10px" id="kioskSaveBtn">บันทึกผลตรวจ</button>
          <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:8px" id="kioskBackBtn">← ย้อนกลับไปแก้เช็คลิสต์</button>
        </div>
      </div>`;
    document.getElementById('kioskPhoto').onchange = (e)=>{
      const file = e.target.files[0];
      const preview = document.getElementById('kioskPhotoPreview');
      if(file){
        const reader = new FileReader();
        reader.onload = (ev)=>{ preview.src = ev.target.result; preview.style.display='block'; };
        reader.readAsDataURL(file);
      }
    };
    document.getElementById('kioskBackBtn').onclick = ()=>{
      kioskState.requestText = document.getElementById('kioskReqText').value;
      kioskState.reporter = document.getElementById('kioskReporterName').value;
      renderStep1();
    };
    const saveBtn = document.getElementById('kioskSaveBtn');
    saveBtn.onclick = async ()=>{
      if(saveBtn.disabled) return;
      const photoFile = document.getElementById('kioskPhoto').files[0];
      if(!photoFile){
        document.getElementById('kioskStep2Error').style.display = 'block';
        return;
      }
      saveBtn.disabled = true;
      saveBtn.textContent = "กำลังเชื่อมต่อ...";
      let subId = null;
      let requestId = null;
      try{
        await waitForFirebaseReady(30000);
        const items = z.items.map((label,idx)=>({label, ok: kioskState.answers[idx]}));
        const requestText = document.getElementById('kioskReqText').value.trim();
        const reporter = document.getElementById('kioskReporterName').value.trim();
        const ts = Date.now();
        subId = uid();
        state.data.submissions.push({
          id: subId, floorId: fid, zoneId: zid, ts, items, reporter,
          photoUrl: "", photoUploadStatus: "pending"
        });
        if(requestText){
          requestId = uid();
          state.data.requests.push({
            id: requestId, floorId: fid, zoneId: zid, ts, text: requestText, status: "pending", reporter,
            dueDate: null, statusHistory: [{ status:"pending", ts }], editLog: []
          });
        }

        // บันทึกเช็คลิสต์ก่อน เพื่อให้กดส่งได้แม้ Google Drive ตอบช้า
        saveBtn.textContent = "กำลังบันทึกรายการ...";
        const firstSaveOk = await saveData();
        if(!firstSaveOk){
          removeSubmissionAndRequest(subId, requestId);
          saveBtn.disabled = false;
          saveBtn.textContent = "บันทึกผลตรวจ";
          return;
        }

        let photoWarning = "";
        try{
          saveBtn.textContent = "บันทึกรายการแล้ว • กำลังบีบอัดรูป...";
          const blob = await compressImage(photoFile, 900, 0.7);
          saveBtn.textContent = "บันทึกรายการแล้ว • กำลังส่งรูป...";
          const photoUrl = await window.__fb.uploadPhoto(blob, `checkin/${subId}.jpg`, PHOTO_UPLOAD_TIMEOUT_MS);
          updateSubmissionPhoto(subId, { photoUrl, photoUploadStatus: "done", photoUploadError: "" });
          const linked = await saveData({ silent:true, timeoutMs:20000 });
          if(!linked) photoWarning = "รูปอัปโหลดขึ้น Drive แล้ว แต่ยังผูก URL รูปกับรายการในฐานข้อมูลไม่สำเร็จ";
        }catch(photoErr){
          console.error("อัปโหลดรูปยืนยันไม่สำเร็จ แต่บันทึกรายการตรวจแล้ว", photoErr);
          photoWarning = photoErr.message || String(photoErr);
          updateSubmissionPhoto(subId, { photoUploadStatus: "failed", photoUploadError: photoWarning });
          await saveData({ silent:true, timeoutMs:10000 });
        }

        renderKioskDone(f, z);
        if(photoWarning){
          setTimeout(()=>alert("บันทึกรายการตรวจสำเร็จแล้ว ✅\n\nแต่รูปยืนยันยังส่งไม่สำเร็จ: " + photoWarning + "\n\nรายการเช็คลิสต์และคำร้องขอถูกบันทึกไว้แล้ว"), 100);
        }
      }catch(e){
        console.error(e);
        if(subId) removeSubmissionAndRequest(subId, requestId);
        saveBtn.disabled = false;
        saveBtn.textContent = "บันทึกผลตรวจ";
        alert("บันทึกไม่สำเร็จ: " + (e.message || "ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต") + "\n\nกดปุ่มบันทึกอีกครั้งเพื่อลองใหม่");
      }
    };
  }

  renderStep1();
}
function renderKioskDone(f, z){

    <div class="kiosk-wrap">
      <div class="kiosk-card" style="text-align:center">
        <div class="kiosk-zone">${f.label} · ${z.name}</div>
        <div style="font-size:44px;margin:14px 0">✅</div>
        <h2 style="margin:0 0 6px">บันทึกเรียบร้อย ขอบคุณครับ</h2>
        <div style="color:var(--text-dim);font-size:13px">ปิดหน้านี้ได้เลย</div>
      </div>
    </div>`;
}

/* ============ INIT ============ */
// อ่านพารามิเตอร์จาก URL ทันที ก่อนรอ Firebase โหลดเสร็จ
const __qrParams = (function(){
  const params = new URLSearchParams(location.search);
  return { floor: params.get('floor'), zone: params.get('zone') };
})();
const isKioskMode = !!(__qrParams.floor && __qrParams.zone && findZone(__qrParams.floor, __qrParams.zone));
let __kioskInteracted = false; // true ทันทีที่พนักงานเริ่มติ๊กเช็ค กันไม่ให้ข้อมูลที่มาทีหลังไปรีเซ็ตฟอร์มที่กำลังกรอกอยู่

// แถบ debug เล็กๆ มุมล่างขวา ช่วยเช็คว่า URL ส่งพารามิเตอร์มาถึง JS จริงไหม (ไม่ต้องเปิด DevTools)
function renderQrDebugFooter(){
  let el = document.getElementById('qrDebugFooter');
  if(!el){
    el = document.createElement('div');
    el.id = 'qrDebugFooter';
    el.style.cssText = 'position:fixed;bottom:4px;right:6px;font-size:9px;color:#94a3a3;opacity:.55;font-family:monospace;z-index:9998;pointer-events:none;background:rgba(255,255,255,.6);padding:2px 5px;border-radius:4px;';
    document.body.appendChild(el);
  }
  el.textContent = (__qrParams.floor || __qrParams.zone)
    ? `QR: floor=${__qrParams.floor||'-'} zone=${__qrParams.zone||'-'}`
    : 'QR: ไม่พบพารามิเตอร์ใน URL';
}
renderQrDebugFooter();

// ===== เก็บสำเนาข้อมูลไว้ในเครื่อง (localStorage) เพื่อให้เปิดครั้งต่อไปเห็นทันที ไม่ต้องรอ =====
const CACHE_KEY = 'fivese_cache_v1';
function loadCachedData(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function cacheData(data){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(data)); }catch(e){}
}
// รอให้ Firebase พร้อมใช้งาน ใช้ตอนกด "บันทึก" เท่านั้น (ไม่บล็อกหน้าจอตั้งแต่ต้น)
// ป้องกันการค้างตลอดกาลถ้าอัปโหลดรูปไม่สำเร็จ (เช่น Storage ตั้งค่าไม่ถูกต้อง เน็ตหลุดกลางทาง)
function withTimeout(promise, ms, message){
  return Promise.race([
    promise,
    new Promise((_, reject)=>setTimeout(()=>reject(new Error(message || `หมดเวลา (เกิน ${Math.round(ms/1000)} วินาที)`)), ms))
  ]);
}
function waitForFirebaseReady(timeoutMs){
  timeoutMs = timeoutMs || 20000;
  return new Promise((resolve, reject)=>{
    if(window.__fbReady){ resolve(); return; }
    if(window.__fbConfigMissing || window.__fbInitError){ reject(new Error('ยังไม่ได้ตั้งค่า Firebase หรือโหลดไม่สำเร็จ')); return; }
    const cleanup = ()=>{
      window.removeEventListener('fbready', onReady);
      window.removeEventListener('fbconfigmissing', onErr);
      window.removeEventListener('fbiniterror', onErr);
      clearTimeout(t);
    };
    const onReady = ()=>{ cleanup(); resolve(); };
    const onErr = ()=>{ cleanup(); reject(new Error('เชื่อมต่อ Firebase ไม่สำเร็จ')); };
    const t = setTimeout(()=>{ cleanup(); reject(new Error('เชื่อมต่อฐานข้อมูลนานเกินไป ลองใหม่อีกครั้ง หรือเช็คสัญญาณอินเทอร์เน็ต')); }, timeoutMs);
    window.addEventListener('fbready', onReady);
    window.addEventListener('fbconfigmissing', onErr);
    window.addEventListener('fbiniterror', onErr);
  });
}

const __cachedData = loadCachedData();
if(__cachedData){
  state.data = __cachedData;
  if(!state.data.gembaFindings) state.data.gembaFindings = [];
}

if(isKioskMode){
  // สำคัญ: โชว์เช็คลิสต์ทันที ไม่ต้องรอ Firebase เลย (ตัวเช็คลิสต์เป็นข้อมูลคงที่ในตัวแอปอยู่แล้ว)
  // Firebase จะเชื่อมต่อกันเบื้องหลัง และถูกใช้จริงตอนกด "บันทึก" เท่านั้น
  renderKioskView(__qrParams.floor, __qrParams.zone);
}else if(__cachedData){
  renderAll();
  const pill = document.createElement('div');
  pill.id = 'syncPill';
  pill.style.cssText = 'position:fixed;bottom:14px;left:14px;background:var(--panel);color:var(--text-dim);border:1px solid var(--line-soft);font-size:11px;padding:6px 12px;border-radius:20px;z-index:9998;font-family:Inter,sans-serif;';
  pill.textContent = 'กำลังซิงค์ข้อมูลล่าสุด...';
  document.body.appendChild(pill);
}else{
  const overlay = document.createElement('div');
  overlay.id = 'qrLoadingOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(10,15,12,.6);display:flex;align-items:center;justify-content:center;z-index:9999;color:#fff;font-family:Inter,sans-serif;font-size:14px;text-align:center;padding:20px;';
  overlay.innerHTML = `<div>กำลังเชื่อมต่อฐานข้อมูล...<br><span style="font-size:11px;opacity:.75">ปกติใช้เวลาไม่กี่วินาที</span></div>`;
  document.body.appendChild(overlay);
}

function handleSnapshotData(data){
  state.data = data || { submissions: [], requests: [], gembaFindings: [] };
  if(!state.data.gembaFindings) state.data.gembaFindings = [];
  cacheData(state.data);
  const overlay = document.getElementById('qrLoadingOverlay');
  if(overlay) overlay.remove();
  const pill = document.getElementById('syncPill');
  if(pill) pill.remove();
  if(isKioskMode){
    // ถ้าพนักงานยังไม่เริ่มติ๊กอะไรเลย และข้อมูลจริงบอกว่าเช็ควันนี้ไปแล้ว ค่อยสลับไปโชว์หน้า "เช็ควันนี้แล้ว"
    // ถ้าเริ่มกรอกไปแล้ว จะไม่แตะฟอร์มที่กำลังกรอกอยู่เด็ดขาด
    if(!__kioskInteracted){
      const st = zoneStatus(__qrParams.floor, __qrParams.zone);
      if(st.checkedToday){
        renderKioskView(__qrParams.floor, __qrParams.zone);
      }
    }
    return;
  }
  renderAll();
}
function startApp(){
  const myReqBtnEl = document.getElementById('myReqBtn');
  if(myReqBtnEl) myReqBtnEl.onclick = openMyRequestsModal;
  const gembaBtnEl = document.getElementById('gembaBtn');
  if(gembaBtnEl) gembaBtnEl.onclick = openGembaModal;
  window.__fb.onSnapshot(handleSnapshotData, (err)=>{
    const overlay = document.getElementById('qrLoadingOverlay');
    if(overlay) overlay.remove();
    console.error("เชื่อมต่อ Firebase ไม่สำเร็จ", err);
    if(!isKioskMode){
      document.getElementById('app').innerHTML = `<div style="padding:60px 20px;text-align:center;color:var(--bad)">
      เชื่อมต่อฐานข้อมูลไม่สำเร็จ ตรวจสอบการตั้งค่า Firebase (firebaseConfig) และ Firestore rules<br>
      <span style="color:var(--text-faint);font-size:12px">${escapeHtml(err.message||String(err))}</span>
    </div>`;
    }
  });
}
if(window.__fbReady){
  startApp();
}else if(window.__fbConfigMissing){
  showFirebaseConfigBanner();
}else if(window.__fbInitError){
  showFirebaseErrorOnPage(window.__fbInitError);
}else{
  window.addEventListener('fbready', startApp);
  window.addEventListener('fbconfigmissing', showFirebaseConfigBanner);
  window.addEventListener('fbiniterror', ()=>showFirebaseErrorOnPage(window.__fbInitError));
}
function showFirebaseErrorOnPage(err){
  if(isKioskMode) return; // อย่าไปทับฟอร์มเช็คลิสต์ที่พนักงานอาจกำลังกรอกอยู่ จะไปเจอ error ตอนกด "บันทึก" แทน
  const overlay = document.getElementById('qrLoadingOverlay');
  if(overlay) overlay.remove();
  document.getElementById('app').innerHTML = `<div style="max-width:600px;margin:60px auto;padding:24px;background:#fff0f0;border:2px solid #f5b0b0;border-radius:12px;color:#8a1f1f;font-family:'IBM Plex Mono',monospace;font-size:13px;text-align:left;white-space:pre-wrap;word-break:break-word">
    <b style="font-size:15px">โหลด Firebase ไม่สำเร็จ</b><br><br>
    ${escapeHtml(err ? (err.message || String(err)) : 'ไม่ทราบสาเหตุ')}
    <br><br>
    <span style="font-size:11px;color:#a15555">ลองปิด extension เบราว์เซอร์ทั้งหมด แล้วรีเฟรชใหม่ หรือเปิดในโหมด Incognito</span>
  </div>`;
}
// เผื่อค้างเงียบเกิน 12 วินาที (ไม่มี ready/error/config-missing เกิดขึ้นเลย) โชว์ข้อมูลวินิจฉัยบนหน้าจอ
// (ไม่มีผลกับโหมด kiosk เพราะไม่มี overlay บังหน้าจอตั้งแต่แรกอยู่แล้ว)
setTimeout(()=>{
  const overlay = document.getElementById('qrLoadingOverlay');
  if(overlay){
    overlay.innerHTML = `<div style="max-width:340px;background:#1a1a1a;padding:20px;border-radius:10px">
      <b>เชื่อมต่อนานผิดปกติ (เกิน 12 วินาที)</b>
      <div style="font-size:11px;opacity:.85;text-align:left;margin-top:10px;line-height:1.7;font-family:monospace">
        โหลดสคริปต์ Firebase: ${window.__fbReady ? 'สำเร็จ ✓' : 'ยังไม่เสร็จ / ล้มเหลว ✗'}<br>
        config: ${window.__fbConfigMissing ? 'ไม่ได้ตั้งค่า' : 'ตั้งค่าแล้ว'}<br>
        init error: ${window.__fbInitError ? escapeHtml(String(window.__fbInitError.message||window.__fbInitError)) : 'ไม่มี'}<br>
        snapshot error: ${window.__fbSnapshotError ? escapeHtml(String(window.__fbSnapshotError.message||window.__fbSnapshotError)) : 'ไม่มี'}
      </div>
      <div style="font-size:11px;opacity:.75;margin-top:12px">ลองปิด extension เบราว์เซอร์ทั้งหมด หรือเปิดในโหมด Incognito แล้วรีเฟรชใหม่</div>
    </div>`;
  }
}, 12000);

function showFirebaseConfigBanner(){
  if(isKioskMode) return; // อย่าไปทับฟอร์มเช็คลิสต์ที่พนักงานอาจกำลังกรอกอยู่
  const overlay = document.getElementById('qrLoadingOverlay');
  if(overlay) overlay.remove();
  document.getElementById('app').innerHTML = `<div style="max-width:560px;margin:80px auto;padding:28px;background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;text-align:center">
    <h2 style="margin-top:0">ยังไม่ได้ตั้งค่า Firebase</h2>
    <p style="color:var(--text-dim);font-size:14px;line-height:1.7">
      เปิดไฟล์นี้ด้วยตัวแก้ไขข้อความ แล้วแก้ค่า <code>firebaseConfig</code> ใกล้ต้นไฟล์ให้เป็นค่าจากโปรเจกต์ Firebase ของคุณ
      (Firebase Console → Project settings → General → Your apps → Web app) จากนั้นรีเฟรชหน้านี้
    </p>
  </div>`;
}
</script>
</body>
</html>
